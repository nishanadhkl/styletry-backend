# Database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/styletry_db}
spring.datasource.username=${DB_USERNAME:styletry_user}
spring.datasource.password=${DB_PASSWORD:styletry123}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# App
spring.application.name=styletry-backend
server.port=8090

# JWT
app.jwt.secret=${JWT_SECRET:styletry-development-jwt-secret-change-before-production}
app.jwt.expiration=86400000

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# CORS
app.cors.allowed-origins=http://localhost:3000

spring.security.filter.order=10
logging.level.org.springframework.security=DEBUG

# Email notifications (set these as environment variables when you want real emails)
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.properties.mail.smtp.ssl.trust=${MAIL_HOST:smtp.gmail.com}

# eSewa ePay test configuration. Replace these for production merchant credentials.
esewa.payment-url=${ESEWA_PAYMENT_URL:https://rc-epay.esewa.com.np/api/epay/main/v2/form}
esewa.product-code=${ESEWA_PRODUCT_CODE:EPAYTEST}
esewa.secret-key=${ESEWA_SECRET_KEY:8gBm/:&EnhH.1/q}
